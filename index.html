<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <canvas id="gameCanvas" width="400"
            height="400"></canvas>
    <p id="info"></p>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

        drawGame();

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        //
        // Step 1: Movement (game loop)
        function moveSnake() {
    // Calculate new head coordinates
    const newHead = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
    };

    // Add new head to front of array
    snake.unshift(newHead);

    // Remove tail segment to keep same length
    snake.pop();
}

// Run game loop every 150 milliseconds
setInterval(() => {
    moveSnake();
    drawGame();
}, 150);

        // Step 2: Keyboard controls (arrow keys)
document.addEventListener("keydown", (event) => {
    switch (event.key) {
        case "ArrowUp":
            // Move up only if not currently moving vertically
            if (direction.y === 0) direction = { x: 0, y: -1 };
            break;
        case "ArrowDown":
            // Move down only if not currently moving vertically
            if (direction.y === 0) direction = { x: 0, y: 1 };
            break;
        case "ArrowLeft":
            // Move left only if not currently moving horizontally
            if (direction.x === 0) direction = { x: -1, y: 0 };
            break;
        case "ArrowRight":
            // Move right only if not currently moving horizontally
            if (direction.x === 0) direction = { x: 1, y: 0 };
            break;
    }
});
        // Step 3: Eating and growing
function generateFood() {
    food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
    };
}

// Updated moveSnake function for Step 3
function moveSnake() {
    const newHead = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
    };

    snake.unshift(newHead);

    // Check if snake head touches food
    if (newHead.x === food.x && newHead.y === food.y) {
        score += 10;           // Increase score
        generateFood();       // Spawn new food position
    } else {
        snake.pop();          // Keep snake same length if no food was eaten
    }
}
        
// Step 4: Game over
        let gameLoop;

// Function to check if the head collides with walls or body
function checkCollision(head) {
    // Wall collision check
    if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        return true;
    }

    // Body collision check
    for (let segment of snake) {
        if (head.x === segment.x && head.y === segment.y) {
            return true;
        }
    }

    return false;
}

// Updated moveSnake function for Step 4
function moveSnake() {
    const newHead = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
    };

    // Check game over before adding new head
    if (checkCollision(newHead)) {
        clearInterval(gameLoop);
        alert("Game Over! Final Score: " + score);
        location.reload(); // Reload page to restart
        return;
    }

    snake.unshift(newHead);

    if (newHead.x === food.x && newHead.y === food.y) {
        score += 10;
        generateFood();
    } else {
        snake.pop();
    }
}

// Store interval ID to enable clearing on game over
gameLoop = setInterval(() => {
    moveSnake();
    drawGame();
}, 150);

        // Step 5: Improvements
let highScore = localStorage.getItem("snakeHighScore") || 0;

function updateScoreBoard() {
    document.getElementById("info").innerText = `Score: ${score} | High Score: ${highScore}`;
}

// Initialize score display
updateScoreBoard();

// Updated moveSnake to handle high score tracking
function moveSnake() {
    const newHead = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
    };

    if (checkCollision(newHead)) {
        clearInterval(gameLoop);
        alert("Game Over! Final Score: " + score);
        location.reload();
        return;
    }

    snake.unshift(newHead);

    if (newHead.x === food.x && newHead.y === food.y) {
        score += 10;
        
        // Save high score to browser storage
        if (score > highScore) {
            highScore = score;
            localStorage.setItem("snakeHighScore", highScore);
        }
        
        updateScoreBoard();
        generateFood();
    } else {
        snake.pop();
    }
}
        //
        // ===================================

    </script>

</body>
</html>
