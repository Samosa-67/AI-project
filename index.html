<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <h1>🐍 NEON SNAKE</h1>
        <p class="subtitle">Classic Snake Arcade Game</p>

        <div class="score-container">
            <div class="score-box">
                <span>SCORE</span>
                <h2 id="score">0</h2>
            </div>

            <div class="score-box">
                <span>HIGH SCORE</span>
                <h2 id="highScore">0</h2>
            </div>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <p id="info">Press an arrow key to start!</p>

        <div class="buttons">
            <button id="pauseBtn">Pause</button>
            <button id="restartBtn">Restart</button>
        </div>

        <div id="gameOver" class="game-over hidden">
            <h2>GAME OVER!</h2>
            <p>Your final score:</p>
            <h2 id="finalScore">0</h2>
            <button id="playAgainBtn">Play Again</button>
        </div>

        <p class="instructions">
            Use the arrow keys to control the snake.
            <br>
            Eat the red food and avoid hitting the walls!
        </p>

    </div>

    <script>

        // ===== GAME SETUP =====

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== GAME VARIABLES =====

        let snake;
        let direction;
        let nextDirection;
        let food;
        let score;
        let highScore = Number(localStorage.getItem("snakeHighScore")) || 0;

        let gameRunning = false;
        let gameOver = false;
        let gamePaused = false;

        let gameLoop;
        let speed = 150;

        // ===== HTML ELEMENTS =====

        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("highScore");
        const infoElement = document.getElementById("info");
        const gameOverElement = document.getElementById("gameOver");
        const finalScoreElement = document.getElementById("finalScore");

        highScoreElement.textContent = highScore;

        // ===== START GAME =====

        function startGame() {

            clearInterval(gameLoop);

            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];

            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };

            score = 0;
            speed = 150;

            gameRunning = true;
            gameOver = false;
            gamePaused = false;

            scoreElement.textContent = score;

            gameOverElement.classList.add("hidden");

            infoElement.textContent = "Good luck!";

            document.getElementById("pauseBtn").textContent = "Pause";

            createFood();
            drawGame();
            updateGameLoop();

        }

        // ===== CREATE FOOD =====

        function createFood() {

            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };

            // Make sure food does not appear on the snake.

            while (snake.some(segment =>
                segment.x === food.x && segment.y === food.y
            )) {

                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };

            }

        }

        // ===== DRAW GAME =====

        function drawGame() {

            ctx.fillStyle = "#101820";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid

            ctx.strokeStyle = "#1c2b36";

            for (let i = 0; i < tileCount; i++) {

                ctx.beginPath();

                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);

                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);

                ctx.stroke();

            }

            // Draw food

            ctx.fillStyle = "#ff3b5c";

            ctx.fillRect(
                food.x * gridSize + 2,
                food.y * gridSize + 2,
                gridSize - 4,
                gridSize - 4
            );

            // Draw snake

            snake.forEach((segment, index) => {

                ctx.fillStyle = index === 0 ? "#a3ff12" : "#39d353";

                ctx.fillRect(
                    segment.x * gridSize + 1,
                    segment.y * gridSize + 1,
                    gridSize - 2,
                    gridSize - 2
                );

            });

        }

        // ===== MOVEMENT =====

        function moveSnake() {

            direction = nextDirection;

            const newHead = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            // Check whether food was eaten.

            const ateFood =
                newHead.x === food.x &&
                newHead.y === food.y;

            // Check wall collision.

            if (
                newHead.x < 0 ||
                newHead.x >= tileCount ||
                newHead.y < 0 ||
                newHead.y >= tileCount
            ) {

                endGame();
                return;

            }

            // Check collision with snake body.

            const bodyToCheck = ateFood ? snake : snake.slice(0, -1);

            const hitBody = bodyToCheck.some(segment =>
                segment.x === newHead.x &&
                segment.y === newHead.y
            );

            if (hitBody) {

                endGame();
                return;

            }

            // Add new head.

            snake.unshift(newHead);

            if (ateFood) {

                score += 10;

                scoreElement.textContent = score;

                // Update high score.

                if (score > highScore) {

                    highScore = score;

                    localStorage.setItem("snakeHighScore", highScore);

                    highScoreElement.textContent = highScore;

                }

                createFood();

                // Increase difficulty.

                speed = Math.max(60, 150 - score);

                updateGameLoop();

            } else {

                snake.pop();

            }

            drawGame();

        }

        // ===== GAME LOOP =====

        function updateGameLoop() {

            clearInterval(gameLoop);

            if (gameRunning && !gamePaused && !gameOver) {

                gameLoop = setInterval(moveSnake, speed);

            }

        }

        // ===== KEYBOARD CONTROLS =====

        document.addEventListener("keydown", function(event) {

            const keys = [
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight"
            ];

            if (keys.includes(event.key)) {
                event.preventDefault();
            }

            if (!gameRunning && !gameOver) {
                startGame();
            }

            if (gameOver || gamePaused) return;

            if (event.key === "ArrowUp" && direction.y !== 1) {

                nextDirection = { x: 0, y: -1 };

            }

            else if (event.key === "ArrowDown" && direction.y !== -1) {

                nextDirection = { x: 0, y: 1 };

            }

            else if (event.key === "ArrowLeft" && direction.x !== 1) {

                nextDirection = { x: -1, y: 0 };

            }

            else if (event.key === "ArrowRight" && direction.x !== -1) {

                nextDirection = { x: 1, y: 0 };

            }

        });

        // ===== GAME OVER =====

        function endGame() {

            clearInterval(gameLoop);

            gameRunning = false;
            gameOver = true;

            finalScoreElement.textContent = score;

            gameOverElement.classList.remove("hidden");

            infoElement.textContent = "Game finished!";

        }

        // ===== PAUSE BUTTON =====

        document.getElementById("pauseBtn").addEventListener("click", function() {

            if (!gameRunning || gameOver) return;

            gamePaused = !gamePaused;

            if (gamePaused) {

                clearInterval(gameLoop);

                this.textContent = "Resume";

                infoElement.textContent = "Game paused";

            } else {

                this.textContent = "Pause";

                infoElement.textContent = "Keep playing!";

                updateGameLoop();

            }

        });

        // ===== RESTART BUTTON =====

        document.getElementById("restartBtn").addEventListener("click", startGame);

        document.getElementById("playAgainBtn").addEventListener("click", startGame);

        // ===== INITIALIZE =====

        startGame();

        gameRunning = false;

        clearInterval(gameLoop);

        infoElement.textContent = "Press an arrow key to start!";

    </script>

</body>
</html>
